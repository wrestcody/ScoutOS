<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fulcrum Verify: Compliance Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">Fulcrum Verify</h1>
            <button id="run-audit-btn" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition-transform transform hover:scale-105">
                Run 'Rate Limiting' Audit
            </button>
        </div>

        <div id="results-container" class="mt-6 hidden">
            <!-- Attestation Section -->
            <div class="bg-white shadow-md rounded-lg p-4 mb-6">
                 <h2 class="text-xl font-semibold text-gray-700 mb-2">✅ Audit Attestation (Verifiable Receipt)</h2>
                 <textarea id="attestation-box" readonly class="w-full h-24 p-2 font-mono text-xs bg-gray-100 border border-gray-300 rounded-md resize-none"></textarea>
            </div>

            <!-- Summary Section -->
            <div id="summary-section" class="bg-white rounded-lg shadow-md p-4 mb-6 text-center"></div>

            <!-- Failed Checks Section -->
            <div id="failed-section" class="mb-6">
                <h2 class="text-2xl font-bold text-red-700 mb-3">❌ Failed Checks (Action Required)</h2>
                <div id="failed-results" class="space-y-4"></div>
            </div>

            <!-- Passed Checks Section -->
            <div id="passed-section">
                <h2 class="text-2xl font-bold text-green-700 mb-3">✅ Passed Checks</h2>
                <div id="passed-results" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('run-audit-btn').addEventListener('click', async () => {
            const resultsContainer = document.getElementById('results-container');
            const attestationBox = document.getElementById('attestation-box');
            const summarySection = document.getElementById('summary-section');
            const failedResultsDiv = document.getElementById('failed-results');
            const passedResultsDiv = document.getElementById('passed-results');

            // Reset and show loading state
            resultsContainer.classList.remove('hidden');
            attestationBox.value = 'Requesting attestation...';
            summarySection.innerHTML = '<p class="text-lg text-gray-500">Running audit...</p>';
            failedResultsDiv.innerHTML = '';
            passedResultsDiv.innerHTML = '';

            try {
                const response = await fetch('http://localhost:8000/api/run-audit/rate-limiting', { method: 'POST' });
                const data = await response.json();

                attestationBox.value = data.audit_attestation || "Error generating attestation.";

                summarySection.innerHTML = `<p class="text-lg font-semibold text-gray-800">Audit Complete! ${data.summary.passed} Passed, ${data.summary.failed} Failed. Main tracker: <strong class="text-blue-600">${data.summary.main_tracker_ticket}</strong></p>`;

                // Build Triage Cards for Failed Checks
                document.getElementById('failed-section').classList.toggle('hidden', data.failed_results.length === 0);
                data.failed_results.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-white shadow-lg rounded-lg p-4 border-l-4 border-red-500';
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-xl font-bold text-gray-900">${item.service_id}</h3>
                            <span class="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-full">${item.severity} Severity</span>
                        </div>
                        <div class="mb-3">
                            <p class="text-sm text-gray-600">Failure:</p>
                            <code class="text-sm text-red-800 bg-red-50 p-1 rounded">${item.failure_reason}</code>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-gray-800">Remediation Ticket:</span>
                            <a href="#" class="font-bold text-blue-600 hover:underline">${item.remediation_ticket} <i class="fas fa-external-link-alt text-xs"></i></a>
                        </div>
                    `;
                    failedResultsDiv.appendChild(card);
                });

                // Build simpler cards for Passed Checks
                document.getElementById('passed-section').classList.toggle('hidden', data.passed_results.length === 0);
                data.passed_results.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-white shadow-md rounded-lg p-3 border-l-4 border-green-500';
                    card.innerHTML = `<p class="text-gray-700">${item.service_id}</p>`;
                    passedResultsDiv.appendChild(card);
                });

            } catch (error) {
                console.error('Error running audit:', error);
                summarySection.innerHTML = '<p class="text-lg font-bold text-red-700">Error: Could not connect to the auditor service.</p>';
                attestationBox.value = 'Error.';
            }
        });
    </script>
</body>
</html>
