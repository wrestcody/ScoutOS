version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: scoutos-pgvector
    environment:
      POSTGRES_USER: scoutos
      POSTGRES_PASSWORD: scoutos_password
      POSTGRES_DB: scoutos_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # Optimized for Apple Silicon (ARM64)
    platform: linux/arm64

volumes:
  pgdata:
