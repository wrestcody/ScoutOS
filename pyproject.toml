[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-forge-tracecat-tools"
version = "0.1.0"
description = "The Janus Forge custom integrations and workflows for Tracecat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["actions*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  "connectors/python/**",
  "mocks/**",
  "infra/**",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"actions/tools/janus/**" = ["E501", "F401", "F841"]
"tools/janus/**" = ["E501", "F401", "F841"]
"tests/**" = ["F401"]
"tracecat_registry.py" = ["F401"]

